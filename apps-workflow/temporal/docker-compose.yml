services:
  temporal:
    image: temporalio/auto-setup
    container_name: temporal-server
    restart: always
    networks:
      - network-apps-workflow
    ports:
      - 7233:7233
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal # change user
      - POSTGRES_PWD=temporal # change password
      - POSTGRES_SEEDS=postgresql # change seeds

  temporal-ui:
    image: temporalio/ui
    container_name: temporal-ui
    depends_on:
      - temporal
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
    networks:
      - network-apps-workflow
    ports:
      - 8080:8080
  
  temporal-admin-tools:
    container_name: temporal-admin-tools
    image: temporalio/admin-tools:1.27.2-tctl-1.18.2-cli-1.3.0
    depends_on:
      - temporal
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CLI_ADDRESS=temporal:7233
    restart: unless-stopped
    networks:
      - network-apps-workflow
    stdin_open: true
    tty: true


networks:
  network-apps-workflow:
    driver: bridge
    name: temporal-network